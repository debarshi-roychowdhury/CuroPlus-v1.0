<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CuroPlus - Coming Soon</title>

<!-- Bootstrap CSS -->
<link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  rel="stylesheet"
/>

<!-- Google Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Poppins',sans-serif;
  background: linear-gradient(135deg,#0d6efd,#4dabf7,#e9f5ff);
  min-height:100vh;
  overflow-x:hidden;
}

.hero-section{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.main-card{
  background:rgba(255,255,255,0.92);
  backdrop-filter: blur(10px);
  border-radius:24px;
  padding:50px 35px;
  max-width:700px;
  width:100%;
  text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,0.12);
}

.logo-box{
  width:95px;
  height:95px;
  margin:0 auto 20px;
  border-radius:50%;
  background:#ffffff;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 8px 20px rgba(13,110,253,0.15);
  overflow:hidden;
}

.logo-box img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.brand-title{
  font-size:2.5rem;
  font-weight:700;
  color:#0d6efd;
}

.brand-sub{
  font-size:1rem;
  color:#6c757d;
  margin-top:6px;
}

.coming-badge{
  display:inline-block;
  background:#0d6efd;
  color:#fff;
  padding:10px 22px;
  border-radius:50px;
  font-weight:600;
  margin:24px 0 18px;
  letter-spacing:0.5px;
}

.desc{
  color:#495057;
  font-size:1.05rem;
  line-height:1.8;
  max-width:520px;
  margin:0 auto;
}

.countdown{
  margin-top:28px;
}

.time-box{
  background:#f8f9fa;
  border-radius:18px;
  padding:18px 10px;
  box-shadow:0 8px 18px rgba(0,0,0,0.05);
}

.time-box h3{
  margin:0;
  color:#0d6efd;
  font-weight:700;
}

.time-box p{
  margin:0;
  font-size:0.9rem;
  color:#6c757d;
}

.notify-box{
  margin-top:28px;
}

.notify-box .form-control{
  border-radius:14px;
  padding:14px;
}

.notify-box .btn{
  border-radius:14px;
  padding:14px;
  font-weight:600;
}

.footer-text{
  margin-top:28px;
  color:#6c757d;
  font-size:0.92rem;
}

@media(max-width:576px){
  .main-card{
    padding:35px 20px;
  }

  .brand-title{
    font-size:2rem;
  }
}
</style>
</head>

<body>

<section class="hero-section">
  <div class="main-card">

    <!-- Logo -->
    <div class="logo-box">
      <!-- Replace with your logo -->
      <img src="images/CuroPlus_Logo.jpg" alt="CuroPlus Logo">
    </div>

    <h1 class="brand-title">CuroPlus</h1>
    <p class="brand-sub">Smart Healthcare Platform</p>

    <div class="coming-badge">🚀 Coming Soon</div>

    <p class="desc">
      We are building something amazing for clinics, doctors and patients.
      Our official website will be launching soon with smarter healthcare solutions.
    </p>

    <!-- Countdown -->
    <div class="countdown container">
      <div class="row g-3 justify-content-center">
        <div class="col-6 col-md-3">
          <div class="time-box">
            <h3 id="days">00</h3>
            <p>Days</p>
          </div>
        </div>

        <div class="col-6 col-md-3">
          <div class="time-box">
            <h3 id="hours">00</h3>
            <p>Hours</p>
          </div>
        </div>

        <div class="col-6 col-md-3">
          <div class="time-box">
            <h3 id="minutes">00</h3>
            <p>Minutes</p>
          </div>
        </div>

        <div class="col-6 col-md-3">
          <div class="time-box">
            <h3 id="seconds">00</h3>
            <p>Seconds</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Notify -->
    <div class="notify-box">
      <div class="row g-2">
        <div class="col-md-8">
          <input
            type="email"
            class="form-control"
            placeholder="Enter your email"
            id="email"
          />
        </div>

        <div class="col-md-4 d-grid">
          <button class="btn btn-primary" onclick="notifyUser()">
            Notify Me
          </button>
        </div>
      </div>
    </div>

    <p class="footer-text">
      © 2026 CuroPlus. All Rights Reserved.
    </p>

  </div>
</section>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
// Set launch date here
const launchDate = new Date("May 15, 2026 00:00:00").getTime();

setInterval(() => {
  const now = new Date().getTime();
  const gap = launchDate - now;

  const days = Math.floor(gap / (1000 * 60 * 60 * 24));
  const hours = Math.floor((gap % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  const minutes = Math.floor((gap % (1000 * 60 * 60)) / (1000 * 60));
  const seconds = Math.floor((gap % (1000 * 60)) / 1000);

  document.getElementById("days").innerText = days >= 0 ? days : "00";
  document.getElementById("hours").innerText = hours >= 0 ? hours : "00";
  document.getElementById("minutes").innerText = minutes >= 0 ? minutes : "00";
  document.getElementById("seconds").innerText = seconds >= 0 ? seconds : "00";
}, 1000);

// Fake notify button
function notifyUser(){
  const email = document.getElementById("email").value.trim();

  if(email === ""){
    alert("Please enter your email.");
    return;
  }

  alert("Thank you! We'll notify you soon.");
  document.getElementById("email").value = "";
}
</script>

</body>
</html>
